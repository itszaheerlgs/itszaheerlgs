name: Live Profile Clock
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub minimum reliable interval)
  workflow_dispatch:          # lets you trigger manually to test
  push:
    branches: [main]          # also runs on every push so you can test immediately

jobs:
  update-clock:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # ← THIS was likely missing — needed to push the SVG back
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz

      - name: Update clock SVG
        run: python update_time.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manila_time.svg
          git diff --cached --quiet || git commit -m "chore: update clock [skip ci]"
          git push
